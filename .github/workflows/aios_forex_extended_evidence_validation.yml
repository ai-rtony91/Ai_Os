name: AIOS Forex Extended Evidence Validation

on:
  pull_request:
    paths:
      - "automation/forex_engine/forex_extended_evidence_campaign_v1.py"
      - "tests/forex_engine/test_forex_extended_evidence_campaign_v1.py"
      - "scripts/forex_delivery/Get-AiOsExtendedEvidenceVerdict.ps1"
      - "scripts/forex_delivery/Invoke-AiOsDailyForexOrchestrator.ps1"
      - ".github/workflows/aios_forex_extended_evidence_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aios-forex-extended-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile extended evidence files
        run: |
          python -m py_compile \
            automation/forex_engine/forex_extended_evidence_campaign_v1.py \
            tests/forex_engine/test_forex_extended_evidence_campaign_v1.py

      - name: Run extended evidence tests
        run: python -m pytest tests/forex_engine/test_forex_extended_evidence_campaign_v1.py -q

      - name: Run related profit gate tests
        run: python -m pytest tests/forex_engine/test_forex_profit_production_next_gate_v1.py -q

  full-forex-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run full Forex suite
        id: full_forex
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest tests/forex_engine -q > full_forex_suite.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload full Forex suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-forex-suite-log
          path: full_forex_suite.log
          if-no-files-found: error
          retention-days: 7

      - name: Print failure tail
        if: steps.full_forex.outcome != 'success'
        run: tail -n 120 full_forex_suite.log

      - name: Enforce full Forex suite result
        if: always()
        shell: bash
        run: |
          test "${{ steps.full_forex.outcome }}" = "success"
