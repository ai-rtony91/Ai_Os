name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Determine expected SHA
        id: sha
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: echo "expected=${PR_HEAD_SHA:-$PUSH_SHA}" >> "$GITHUB_OUTPUT"
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.expected }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.expected }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python scripts/ci/run_aios_dual_ci_validation_v1.py --expected-sha "$EXPECTED_SHA" --receipt-path aios-dual-ci-receipt.json
      - name: Retain sanitized validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-dual-ci-receipt
          path: aios-dual-ci-receipt.json
          if-no-files-found: ignore
