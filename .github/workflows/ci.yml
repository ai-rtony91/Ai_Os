name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then expected="$PR_HEAD_SHA"; else expected="$PUSH_SHA"; fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo SHA_SOURCE_UNAVAILABLE_BLOCKED; exit 1; }
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared Dual-CI validation
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          RECEIPT: ${{ runner.temp }}/aios-github-receipt.json
        run: python -B scripts/ci/run_aios_dual_ci_validation_v1.py --provider GITHUB_ACTIONS --expected-sha "$EXPECTED_SHA" --receipt "$RECEIPT"
